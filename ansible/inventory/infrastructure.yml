---
all:
  children:
    firewalls:
      hosts:
        opnsense-gw:
          ansible_host: 192.168.1.125
      vars:
        ansible_become: false
        ansible_python_interpreter: /usr/bin/python3
        ansible_opnsense_key: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_KEY') }}"
        ansible_opnsense_secret: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_SECRET') }}"
        ansible_opnsense_verify_ssl: false

    proxmox_hosts:
      hosts:
        proxmox-01:
          ansible_host: 192.168.1.7
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        ansible_python_interpreter: /usr/bin/python3
