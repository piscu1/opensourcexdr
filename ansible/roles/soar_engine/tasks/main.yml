---
- name: Ensure SOAR directory exists
  ansible.builtin.file:
    path: /opt/soar
    state: directory
    owner: wazuh
    group: wazuh
    mode: '0750'

- name: Copy SOAR engine Python script
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../soar-python/soar_engine.py"
    dest: /opt/soar/soar_engine.py
    owner: wazuh
    group: wazuh
    mode: '0750'

- name: Configure SOAR environment (.env)
  ansible.builtin.template:
    src: soar.env.j2
    dest: /opt/soar/.env
    owner: wazuh
    group: wazuh
    mode: '0600'

- name: Create systemd service for SOAR engine
  ansible.builtin.template:
    src: soar.service.j2
    dest: /etc/systemd/system/soar-engine.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart SOAR engine

- name: Ensure SOAR engine is enabled and running
  ansible.builtin.service:
    name: soar-engine
    state: started
    enabled: true
