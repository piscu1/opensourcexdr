---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Default deny incoming, allow outgoing
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow SSH from management subnet
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    src: "{{ management_subnet | default('10.0.10.0/24') }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
