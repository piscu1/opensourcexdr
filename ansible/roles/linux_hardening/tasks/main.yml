---
- name: Install hardening utilities
  ansible.builtin.apt:
    name:
      - fail2ban
      - auditd
    state: present

- name: Apply kernel network hardening parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-lab-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.all.rp_filter = 1
      kernel.randomize_va_space = 2
      fs.suid_dumpable = 0
  notify: Reload sysctl

- name: Enable and start hardening services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - auditd
    - fail2ban
    - unattended-upgrades

- name: Harden sshd (key-only auth, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      X11Forwarding no
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
    validate: /usr/sbin/sshd -t -f %s
  when: ssh_hardening_enabled | default(true)
  notify: Restart sshd
