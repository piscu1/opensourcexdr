---
- name: Configure and Hardden Proxmox Hypervisor for Zero Trust Lab
  hosts: proxmox_hosts
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Disable IP forwarding on the Hypervisor (Enforce routing via OPNsense)
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '0'
        state: present
        sysctl_set: true
        reload: true
      tags: hardening

    - name: Disable IPv6 on the Hypervisor (Attack Surface Reduction)
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.disable_ipv6
        value: '1'
        state: present
        sysctl_set: true
        reload: true
      tags: hardening
