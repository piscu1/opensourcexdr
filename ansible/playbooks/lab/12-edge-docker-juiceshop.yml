---
- name: Deploy OWASP Juice Shop on Edge VLAN
  hosts: edge
  become: true
  gather_facts: true

  vars:
    juiceshop_container_name: "juice-shop"
    juiceshop_image: "bkimminich/juice-shop"
    juiceshop_host_port: "80"
    juiceshop_container_port: "3000"
    juiceshop_data_dir: "/opt/juice-shop"
    docker_packages:
      - docker.io
      - docker-compose-v2
      - python3-docker

  pre_tasks:
    - name: Assert this playbook is only used on the intended host
      ansible.builtin.assert:
        that:
          - inventory_hostname == "edge-docker"
        fail_msg: "Refusing to continue to prevent accidental deployment of Juice Shop elsewhere."

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker runtime packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create Juice Shop working directory
      ansible.builtin.file:
        path: "{{ juiceshop_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy Docker Compose file
      ansible.builtin.template:
        src: edge-docker-juiceshop-compose.yml.j2
        dest: "{{ juiceshop_data_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Pull and Run Juice Shop via Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ juiceshop_data_dir }}"
      register: compose_output
      changed_when: "'Started' in compose_output.stdout or 'Created' in compose_output.stdout"

    - name: Ensure UFW is disabled for experiment purposes
      community.general.ufw:
        state: disabled

    - name: Validate Juice Shop container is running
      ansible.builtin.command:
        cmd: docker ps --filter "name={{ juiceshop_container_name }}" --format "{% raw %}{{.Status}}{% endraw %}"
      register: docker_status
      changed_when: false

    - name: Assert Juice Shop container is Up
      ansible.builtin.assert:
        that:
          - "'Up' in docker_status.stdout"
        fail_msg: "Juice Shop container is not running."

  post_tasks:
    - name: Print final status
      ansible.builtin.debug:
        msg:
          - "OWASP Juice Shop is now RUNNING and INTENTIONALLY VULNERABLE."
          - "UFW allows TCP/{{ juiceshop_host_port }}."
          - "Target: http://{{ ansible_host }}/"
