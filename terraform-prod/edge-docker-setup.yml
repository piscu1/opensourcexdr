#cloud-config

hostname: edge-docker
manage_etc_hosts: true

users:
  - name: ansible
    gecos: Ansible Automation User
    groups:
      - sudo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: false
    ssh_authorized_keys:
      - "ssh-ed25519 REPLACE_WITH_YOUR_PUBLIC_KEY"

ssh_pwauth: true
disable_root: true

package_update: true
package_upgrade: false

packages:
  - qemu-guest-agent
  - curl
  - ca-certificates
  - gnupg
  - lsb-release
  - python3
  - python3-apt

runcmd:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent

final_message: "edge-docker cloud-init bootstrap completed."
